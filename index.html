<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christian & Judy Ann Invitation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
    --navy: #001F3F;
    --slate: #4A5D6E;
    --off-white: #FCFBF9;
    --gold: #C5A059;
    --lightb: #909ba5;
}

body, html { 
    margin: 0; 
    padding: 0; 
    height: 100%; 
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

.wedding-bg {
    position: relative;
    width: 100%;
    height: 100vh;
    background: linear-gradient(rgba(25, 44, 66, 0.4), rgba(120, 161, 250, 0.3)),
                url('images/JUL01472.jpg') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto; /* allow scroll on small screens */
}

.card { 
    width: 90%;
    max-width: 400px;
    max-height: 80vh; /* limit height */
    background: rgba(252, 251, 249, 0.85); /* semi-transparent */
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
    overflow-y: auto; /* scroll inside card if content is too tall */
}

.card:hover {
    transform: scale(1.02);
}

.wedding-invitation { 
    font-family: 'Great Vibes', cursive; 
    font-size: clamp(1.6rem, 5vw, 2.5rem); 
    color: var(--gold); 
    margin: 0 0 10px 0;
    line-height: 1.1;
}

.wedding-title { 
    font-family: 'Playfair Display', serif; 
    font-size: clamp(1rem, 3vw, 1.4rem); 
    color: var(--navy); 
    margin: 5px 0; 
    font-weight: 700; 
}

.wedding-note { 
    font-size: 0.8rem; 
    line-height: 1.3; 
    max-width: 90%; 
    margin: 10px auto;
    display: block;
    color: #dc3545;
}

.form-container { width: 100%; max-width: 220px; margin: 15px auto 0; }
.input-custom { 
    border-radius: 20px; border: 1px solid #ccc; text-align: center; 
    font-size: 0.9rem; padding: 8px; width: 100%; outline: none; 
}
.btn-modern { 
    background-color: var(--navy); color: white; border-radius: 20px; 
    font-size: 0.9rem; padding: 10px; text-transform: uppercase; 
    width: 100%; border: none; font-weight: 600; cursor: pointer; 
}

.shake { animation: shake 0.5s; }
@keyframes shake { 
    0%, 100% {transform: translateX(0);} 
    25% {transform: translateX(-5px);} 
    75% {transform: translateX(5px);} 
}

/* Responsive adjustments for mobile */
@media (max-width: 576px) {
   .wedding-bg {
        background: linear-gradient(rgba(25, 44, 66, 0.4), rgba(120, 161, 250, 0.3)),
                    url('images/JUL01472_mobile.jpg') no-repeat center center fixed;
        background-size: contain; /* or cover if you prefer */
    }

    .card {
        width: 95%;
        max-width: 350px;
        padding: 15px;
        max-height: 75vh; /* smaller on mobile */
    }

    .wedding-note { font-size: 0.7rem; }
    .input-custom, .btn-modern { font-size: 0.8rem; padding: 8px; }
}
</style>
</head>
<body>

<div class="wedding-bg">
    <div class="card" id="invitationCard">
        <h2 class="wedding-title">You're Invited to the Wedding of</h2>
        <h3 class="wedding-invitation">Christian & Judy Ann</h3>
        
        <small class="wedding-note">
            Enter the password from your invitation
        </small>
        
        <hr style="width: 40px; margin: 12px auto; border-top: 1px solid var(--gold);">
        
        <div class="form-container">
            <form onsubmit="verifyCode(); return false;" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <input type="password" id="accessCode" class="input-custom" placeholder="ACCESS CODE">
                <button type="button" class="btn-modern" onclick="verifyCode()">Unlock</button>
            </form>
        </div>
    </div>
</div>

<script>
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0').toLowerCase()).join('');
}

async function verifyCode() {
    const userInput = document.getElementById('accessCode').value.trim().toUpperCase();
    const card = document.getElementById('invitationCard');
    const unlockBtn = document.querySelector('.btn-modern');
    
    if (unlockBtn.disabled) return;

    const storedHash = "a4346cb093167f255272af71a157d8591b6ce0fe5083b61d13ba44d840d4183b";

    try {
        const inputHash = await sha256(userInput);

        if (inputHash === storedHash) {
            unlockBtn.disabled = true;
            unlockBtn.innerHTML = 'Success!';
            unlockBtn.style.backgroundColor = "#28a745"; 
            
            setTimeout(() => {
                window.location.href = "invitationForm.html";
            }, 800);

        } else {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 500);
            alert("Incorrect code. Please try again.");
            document.getElementById('accessCode').value = "";
        }
    } catch (error) {
        console.error("Error:", error);
    }
}
</script>

</body>
</html>
